[project]
name = "memes-worker"
version = "0.1.0"
description = "Memes DB worker service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "memes-kernel>=0.1,<0.2", "httpx>=0.28,<0.29", "pydantic-settings>=2.8,<3.0", "Pillow>=11.2,<13.0"]

[tool.poetry]
packages = [{include = "memes_worker", from = "src"}]

[tool.poetry.dependencies]
memes-kernel = {path = "../../packages/kernel", develop = true}

[project.scripts]
memes-worker = "memes_worker.presentation.main:main"
memes-worker-evaluate = "memes_worker.presentation.evaluation:main"
memes-worker-prepare-model = "memes_worker.presentation.prepare_models:main"

[tool.ruff]
extend = "../../pyproject.toml"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
numpy = {version = ">=1.26,<3.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
huggingface-hub = {version = ">=0.30,<2.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
peft = {version = ">=0.17,<1.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
sentence-transformers = {version = ">=5.1,<6.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
torch = {version = "2.8.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
torchvision = {version = "0.23.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
transformers = {version = ">=5.0,<6.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
av = {version = ">=14.0,<17.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
librosa = {version = ">=0.11,<1.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
soundfile = {version = ">=0.13,<1.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
faster-whisper = {version = ">=1.1,<2.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
ctranslate2 = {version = "4.8.2", markers = "sys_platform == 'linux' and python_version < '3.13'"}

[tool.poetry.group.ocr]
optional = true

[tool.poetry.group.ocr.dependencies]
numpy = {version = ">=1.26,<2.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
paddleocr = {version = ">=2.10,<3.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}
paddlepaddle = {version = ">=2.6,<3.0", markers = "sys_platform == 'linux' and python_version < '3.13'"}

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=0.25,<2.0"
numpy = ">=1.26,<3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not worker_ml'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["worker_ml: opt-in real offline model/container smoke", "integration: requires real PostgreSQL and S3", "gpu: requires an actual GPU and pinned ML weights", "acceptance: validates PRD acceptance scenarios"]
