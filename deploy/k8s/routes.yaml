apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: memes-db
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  parentRefs:
    - name: memes-db
      sectionName: http
  hostnames:
    - localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity
  namespace: memes-db
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  parentRefs:
    - name: memes-db
      sectionName: http
  hostnames:
    - localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/auth
        - path:
            type: PathPrefix
            value: /v1/operator
      backendRefs:
        - name: identity
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog
  namespace: memes-db
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  parentRefs:
    - name: memes-db
      sectionName: http
  hostnames:
    - localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/uploads
        - path:
            type: PathPrefix
            value: /v1/media
        - path:
            type: PathPrefix
            value: /v1/groups
        - path:
            type: PathPrefix
            value: /v1/variations
      timeouts:
        request: 180s
        backendRequest: 180s
      backendRefs:
        - name: catalog
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: search
  namespace: memes-db
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  parentRefs:
    - name: memes-db
      sectionName: http
  hostnames:
    - localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/search
      backendRefs:
        - name: search
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
  namespace: memes-db
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  parentRefs:
    - name: memes-db
      sectionName: http
  hostnames:
    - localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /memes-media
      timeouts:
        request: 180s
        backendRequest: 180s
      backendRefs:
        - name: s3
          port: 8333
