apiVersion: v1
kind: Service
metadata:
  name: vmalert-metrics
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: vmalert-metrics
  ports:
    - name: http
      port: 8880
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert-metrics
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert-metrics
        app.kubernetes.io/part-of: memes-db-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.0
          args:
            - -rule=/etc/vmalert/rules.yaml
            - -datasource.url=http://victoria-metrics.monitoring.svc:8428
            - -notifier.url=http://alertmanager:9093
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-metrics-rules
