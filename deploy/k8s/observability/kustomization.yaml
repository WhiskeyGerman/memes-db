apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - victorialogs.yaml
  - vector.yaml
  - vmalert-logs.yaml
  - vmalert-metrics.yaml
  - alertmanager.yaml
configMapGenerator:
  - name: vector-config
    namespace: observability
    files:
      - vector.yaml=config/vector.yaml
  - name: vmalert-rules
    namespace: observability
    files:
      - rules.yaml=config/log-rules.yaml
  - name: vmalert-metrics-rules
    namespace: observability
    files:
      - rules.yaml=config/metric-rules.yaml
  - name: alertmanager-config
    namespace: observability
    files:
      - alertmanager.yaml=config/alertmanager.yaml
