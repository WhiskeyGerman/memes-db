apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - victorialogs.yaml
  - vector.yaml
  - alerting.yaml
configMapGenerator:
  - name: vector-config
    namespace: observability
    files:
      - vector.yaml=config/vector.yaml
  - name: vmalert-rules
    namespace: observability
    files:
      - rules.yaml=config/alerts.yaml
  - name: alertmanager-config
    namespace: observability
    files:
      - alertmanager.yaml=config/alertmanager.yaml
