server:
  fullnameOverride: victoria-metrics
  retentionPeriod: 35d
  extraArgs:
    vmui.customDashboardsPath: /etc/vm/dashboards
    search.maxPointsSubqueryPerTimeseries: "200000"
  extraVolumes:
    - name: sli-dashboards
      configMap:
        name: memes-db-sli-dashboards
  extraVolumeMounts:
    - name: sli-dashboards
      mountPath: /etc/vm/dashboards
      readOnly: true
  persistentVolume:
    enabled: true
    storageClassName: standard
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  scrape:
    enabled: false
