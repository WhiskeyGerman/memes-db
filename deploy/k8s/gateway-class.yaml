apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: memes-db-proxy
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
        patch:
          type: StrategicMerge
          value:
            spec:
              strategy:
                type: Recreate
                rollingUpdate: null
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 10m
                          memory: 32Mi
                        limits:
                          cpu: 100m
                          memory: 128Mi
      envoyService:
        name: memes-db-gateway
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: memes-db-envoy
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: memes-db-proxy
    namespace: envoy-gateway-system
