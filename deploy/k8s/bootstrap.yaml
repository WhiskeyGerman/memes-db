apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  namespace: memes-db
  labels:
    app.kubernetes.io/part-of: memes-db
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/part-of: memes-db
        app.kubernetes.io/component: bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: memes-db-backend:task-03-v2
          imagePullPolicy: Never
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              python /app/deploy/scripts/init_s3.py
              export MEMES_DATABASE_URL="$MEMES_IDENTITY_DATABASE_URL"
              alembic -c services/identity/alembic.ini upgrade head
              export MEMES_DATABASE_URL="$MEMES_CATALOG_DATABASE_URL"
              alembic -c services/catalog/alembic.ini upgrade head
              export MEMES_DATABASE_URL="$MEMES_PROCESSING_DATABASE_URL"
              alembic -c services/processing/alembic.ini upgrade head
              export MEMES_DATABASE_URL="$MEMES_SEARCH_DATABASE_URL"
              memes-search-migrate
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-credentials
          env:
            - name: MEMES_IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-database
                  key: MEMES_DATABASE_URL
            - name: MEMES_CATALOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-database
                  key: MEMES_DATABASE_URL
            - name: MEMES_PROCESSING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: processing-database
                  key: MEMES_DATABASE_URL
            - name: MEMES_SEARCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: search-database
                  key: MEMES_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
