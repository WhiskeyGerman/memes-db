# Шаблон: скопируйте в .local/secrets.yaml и замените все REPLACE_WITH_...
apiVersion: v1
kind: Secret
metadata:
  name: backend-credentials
  namespace: memes-db
type: Opaque
stringData:
  MEMES_INTERNAL_API_KEY: REPLACE_WITH_INTERNAL_API_KEY
  MEMES_S3_ACCESS_KEY: REPLACE_WITH_S3_ACCESS_KEY
  MEMES_S3_SECRET_KEY: REPLACE_WITH_S3_SECRET_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: memes-db
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_POSTGRES_PASSWORD
  IDENTITY_DATABASE_PASSWORD: REPLACE_WITH_IDENTITY_DATABASE_PASSWORD
  CATALOG_DATABASE_PASSWORD: REPLACE_WITH_CATALOG_DATABASE_PASSWORD
  PROCESSING_DATABASE_PASSWORD: REPLACE_WITH_PROCESSING_DATABASE_PASSWORD
  SEARCH_DATABASE_PASSWORD: REPLACE_WITH_SEARCH_DATABASE_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-database
  namespace: memes-db
type: Opaque
stringData:
  MEMES_DATABASE_URL: postgresql+asyncpg://memes_identity:REPLACE_WITH_IDENTITY_DATABASE_PASSWORD@postgres:5432/memes_identity
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-database
  namespace: memes-db
type: Opaque
stringData:
  MEMES_DATABASE_URL: postgresql+asyncpg://memes_catalog:REPLACE_WITH_CATALOG_DATABASE_PASSWORD@postgres:5432/memes_catalog
---
apiVersion: v1
kind: Secret
metadata:
  name: processing-database
  namespace: memes-db
type: Opaque
stringData:
  MEMES_DATABASE_URL: postgresql+asyncpg://memes_processing:REPLACE_WITH_PROCESSING_DATABASE_PASSWORD@postgres:5432/memes_processing
---
apiVersion: v1
kind: Secret
metadata:
  name: search-database
  namespace: memes-db
type: Opaque
stringData:
  MEMES_DATABASE_URL: postgresql+asyncpg://memes_search:REPLACE_WITH_SEARCH_DATABASE_PASSWORD@postgres:5432/memes_search
